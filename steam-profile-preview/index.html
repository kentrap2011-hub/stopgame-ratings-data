const VOICES={"welcome":"Привет! Это игра про время. Я всё расскажу голосом. Нажми на первую игру!","unit_intro":"Секунда, минута и час — это кусочки времени. Секунда очень короткая. В одной минуте шестьдесят секунд. В одном часе шестьдесят минут. Нажми на три картинки, чтобы послушать.","unit_sec":"Секунда! Скажи: тик. Вот примерно столько длится одна секунда.","unit_min":"Минута! В ней шестьдесят секунд. Хочешь почувствовать целую минуту? Нажми на круглый таймер.","unit_hour":"Час! В нём шестьдесят минут. За час можно долго гулять или посмотреть мультфильм.","timer_start":"Сейчас пройдёт настоящая минута. Смотри, как движется кружок.","timer_done":"Ура! Прошла одна настоящая минута. Это шестьдесят секунд!","hand_intro":"У часов есть стрелки. Короткая синяя показывает часы. Длинная розовая показывает минуты. Тонкая жёлтая показывает секунды. Нажми на каждую стрелку.","hand_hour":"Короткая синяя — часовая стрелка. Она показывает, который час.","hand_min":"Длинная розовая — минутная стрелка. Она показывает минуты.","hand_sec":"Тонкая жёлтая — секундная стрелка. Она движется быстрее всех.","whole_intro":"Смотри: длинная розовая стрелка стоит наверху, на двенадцати. Значит, сейчас ровно. Синяя короткая указывает на три. Получается три часа ровно.","half_intro":"Когда длинная стрелка смотрит вниз, на шесть, прошло тридцать минут. Это полчаса. Смотри: четыре часа тридцать минут. Короткая стрелка уже между четвёркой и пятёркой.","quarter_intro":"Когда длинная стрелка смотрит вправо, на три, прошло пятнадцать минут. Когда смотрит влево, на девять, прошло сорок пять минут. Это четверти часа.","five_intro":"Каждая большая цифра для длинной стрелки означает ещё пять минут. На единице — пять минут. На двойке — десять. На тройке — пятнадцать. На четвёрке — двадцать. Попробуем!","precise_intro":"На часах есть маленькие чёрточки. Каждая чёрточка — одна минута. После пятнадцати идут шестнадцать, семнадцать. Вот семь часов семнадцать минут. Теперь выбирай цифры под часами.","mix_in function voiceScore(v){

  if(/ru[_-]ru/i.test(v.lang))score+=12;
  if(/google|microsoft|natural|neural|premium|enhanced|светлана|милена/i.test(name))score+=25;
  if(!v.localService)score+=4;
  if(/espeak|festival|robot/i.test(name))score-=80;
  return score;
}

function clockSvg(hr,min,sec=null,opts={}){

}
function handShape(which){const length=which==='hour'?42:which==='minute'?72:79;const w=which==='hour'?11:which==='minute'?6:2.5;const c=which==='hour'?'#2e82d9':which==='minute'?'#ed5b89':'#eba724';return `<svg class="handdrawing" viewBox="0 0 110 107" aria-hidden="true"><circle cx="55" cy="90" r="8" fill="#26334f"/><line x1="55" y1="90" x2="55" y2="${90-length}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="55" cy="90" r="3" fill="white"/></svg>`}
function home(){page='home';stopMoving();if(timerInterval){clearInterval(timerInterval);timerInterval=null}let all=LESSONS.map((lesson,i)=>{const ok=i<=unlocked,won=finished.includes(i);return `<button ${ok?'':'disabled'} class="lessonCard ${i===unlocked?'available':''}" onclick="openLevel(${i})"><span class="lessonIcon">${lesson.emoji}</span><span><span class="lessonTitle">${hEsc(lesson.title)}</span><span class="lessonInfo">${won?'⭐ пройдено':ok?'▶ играть':'🔒 позже'}</span></span></button>`}).join('');app.innerHTML=commonHeader()+`<section class="panel hero"><div class="bigemoji">⏰</div><h1>Научимся<br>понимать время!</h1><p class="sub">Нажимай и слушай. Читать почти не нужно.</p><button class="startbtn" onclick="openLevel(${unlocked})">▶ Играть</button><div class="smallControls"><button class="secondary" onclick="openVoiceSettings()">🎙️ Проверить голос</button></div><div class="subtle">🔊 Включи звук на телефоне</div></section><div class="list">${all}</div><div class="footer">Прогресс сохраняется · Голос зависит от настроек телефона</div>`}
function toHome(){stopSound();home()}
function openLevel(i){if(i>unlocked)return;stopMoving();level=i;question=0;score=0;lock=false;chosen=-1;explored=new Set();intro()}
function titleBlock(){return `<div class="lessonHead"><h1>${LESSONS[level].emoji} ${hEsc(LESSONS[level].title)}</h1><span class="voiceBadge">🔊 Слушай</span></div>`}
function demoClocks(demo){if(!demo)return'';return `<div class="clockDemo ${demo.length>1?'two':''}">${demo.map(c=>`<div>${clockSvg(c[0],c[1],null,{minutesLabels:level===5})}<div class="tinyLabel">${timeText(c)}</div></div>`).join('')}</div>`}
function unitExploreCard(id){const a=UNIT_INFO[id];return `<button class="exploreBtn ${explored.has(id)?'touched':''}" onclick="explore('${id}')"><span class="unitEmoji">${a[0]}</span><span>${a[1]}</span>${explored.has(id)?'✓':''}</button>`}
function handExploreCard(id){const a=HAND_INFO[id];return `<button class="exploreBtn ${explored.has(id)?'touched':''}" onclick="explore('${id}')">${handShape(id)}<span>${a[1]}</span>${explored.has(id)?'✓':''}</button>`}
function intro(){page='intro';let l=LESSONS[level];let content='';if(level===0){content=`<div class="demoExplore">${['sec','min','hour'].map(unitExploreCard).join('')}</div><div class="minuter"><div class="tinyLabel">⏳ Настоящая минута</div><div id="timerDisplay" class="timerFace">1:00</div><div class="timerTrack"><div id="timerFill" class="timerFill"></div></div><button class="secondary" id="timerButton" onclick="startMinute()">▶ 1 минута</button></div>`}else if(level===1){content=`<div class="clockDemo" id="movingClock">${clockSvg(2,50,15)}</div><div class="smallControls"><button class="secondary" onclick="animateClock('minute')">▶ 1 минута</button><button class="secondary" onclick="animateClock('hour')">▶ 1 час</button></div><div class="demoExplore">${['hour','minute','second'].map(handExploreCard).join('')}</div>`}else{content=demoClocks(l.demo)}let hint=l.kind==='hand'||l.kind==='unit'?'<div class="exploreNote">👆 Нажми на каждую картинку</div>':'';app.innerHTML=commonHeader()+titleBlock()+`<section class="panel stage"><div class="spoken" id="spokenIntro">👂 Слушай и смотри</div><button class="speakerBtn" aria-label="Послушать объяснение" onclick="talk('${l.intro}')">🔊</button>${content}${hint}<button class="startbtn" onclick="beginQuiz()">▶ Играть!</button></section>`;talk(l.intro)}
function explore(id){explored.add(id);if(level===0){['sec','min','hour'].forEach(k=>{let btns=document.querySelectorAll('.exploreBtn');let i=['sec','min','hour'].indexOf(k);if(btns[i])btns[i].classList.toggle('touched',explored.has(k))});talk(UNIT_INFO[id][2])}else{['hour','minute','second'].forEach(k=>{let btns=document.querySelectorAll('.exploreBtn');let i=['hour','minute','second'].indexOf(k);if(btns[i])btns[i].classList.toggle('touched',explored.has(k))});talk(HAND_INFO[id][2])}}
function stopMoving(){if(moveInterval){clearInterval(moveInterval);moveInterval=null}}
function animateClock(type){stopMoving();const el=document.getElementById('movingClock');if(!el)return;const duration=type==='minute'?7500:11000;let start=performance.now();talk(type==='minute'?'watch_minute':'watch_hour');moveInterval=setInterval(()=>{const t=clamp((performance.now()-start)/duration,0,1);if(type==='minute'){const seconds=15+Math.floor(t*60);const min=50+Math.floor(seconds/60);el.innerHTML=clockSvg(2,min,seconds%60)}else{const seconds=2*3600+50*60+15+Math.floor(t*3600);const hour=Math.floor(seconds/3600),min=Math.floor(seconds%3600/60);el.innerHTML=clockSvg(hour,min,null)}if(t>=1)stopMoving()},90)}
function startMinute(){if(timerInterval)return;timerSeconds=60;talk('timer_start');let last=Date.now();const label=document.getElementById('timerDisplay');const fill=document.getElementById('timerFill');document.getElementById('timerButton').disabled=true;timerInterval=setInterval(()=>{const now=Date.now();timerSeconds=clamp(timerSeconds-(now-last)/1000,0,60);last=now;if(label)label.textContent='0:'+String(Math.ceil(timerSeconds)).padStart(2,'0');if(fill)fill.style.width=(100*(60-timerSeconds)/60)+'%';if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;document.getElementById('timerButton').disabled=false;document.getElementById('timerButton').textContent='↻ Ещё раз';talk('timer_done')}},140)}
function beginQuiz(){stopMoving();if(timerInterval){clearInterval(timerInterval);timerInterval=null}page='quiz';question=0;score=0;showQuiz()}
function choiceMarkup(option,index,q){let ins='',cls='';if(q.kind==='unit'){let inf=UNIT_INFO[option];ins=`<div class="unitEmoji">${inf[0]}</div><div class="unitName">${inf[1]}</div>`;cls='symbol'}else if(q.kind==='hand'){ins=`${handShape(option)}<span class="unitName">${HAND_INFO[option][1]}</span>`;cls='symbol'}else if(q.kind==='digital'){ins=timeText(option);cls='digital'}else{ins=clockSvg(option[0],option[1]);cls='clockChoice'}return `<button id="option${index}" class="choice ${cls}" onclick="answer(${index})" aria-label="Ответ ${index+1}">${ins}</button>`}
function showQuiz(){page='quiz';lock=false;chosen=-1;const l=LESSONS[level],qs=l.questions,q=qs[question];let dots=qs.map((_,i)=>`<div class="pip ${i<question?'done':i===question?'current':''}"></div>`).join('');let sample=q.kind==='digital'?`<div class="clockDemo">${clockSvg(q.target[0],q.target[1])}</div>`:'';app.innerHTML=commonHeader()+titleBlock()+`<div class="progressLabel center">${question+1} / ${qs.length}</div><div class="bar">${dots}</div><section class="panel center"><div class="questionBox" id="questionText">${hEsc(VOICES[q.prompt])}</div><button class="speakerBtn" style="margin:10px auto 1px" onclick="talk('${q.prompt}')" aria-label="Повтори вопрос">🔊</button>${sample}<div class="choices">${q.options.map((o,i)=>choiceMarkup(o,i,q)).join('')}</div><div id="answerInfo" class="answerHint"></div><div class="smallControls" id="quizControls"></div></section>`;talk(q.prompt)}
function answer(i){if(lock)return;lock=true;chosen=i;const q=LESSONS[level].questions[question],correct=i===q.correct;if(correct)score++;for(let j=0;j<q.options.length;j++){const btn=document.getElementById('option'+j);btn.disabled=true;if(j===q.correct)btn.classList.add('correct');else if(j===i)btn.classList.add('wrong')};document.getElementById('answerInfo').textContent=correct?'⭐ Правильно!':'👀 Вот правильный ответ';document.getElementById('quizControls').innerHTML=`<button class="startbtn" onclick="nextQuestion()">${question===LESSONS[level].questions.length-1?'🏁 Готово':'▶ Дальше'}</button>`;talk(correct?'correct':q.explain)}
function nextQuestion(){question++;if(question>=LESSONS[level].questions.length)result();else showQuiz()}
function result(){page='result';const total=LESSONS[level].questions.length,passed=score>=Math.ceil(total*.8);if(passed){if(!finished.includes(level))finished.push(level);unlocked=Math.max(unlocked,Math.min(7,level+1));save()}const id=passed?(level===7?'completed':'pass'):'retry';const stars=score===total?3:passed?2:1;app.innerHTML=commonHeader()+`<section class="panel hero"><div class="bigemoji">${passed?'🎉':'🌱'}</div><div class="stars">${'⭐'.repeat(stars)}</div><div class="endMessage">${passed?'Получилось!':'Давай ещё раз!'}</div><p class="sub">${score} из ${total}</p><button class="speakerBtn" onclick="talk('${id}')">🔊</button><div class="smallControls"><button class="secondary" onclick="openLevel(${level})">↻ Повторить</button><button class="startbtn" onclick="${passed&&level<7?'openLevel('+(level+1)+')':'toHome()'}">${passed&&level<7?'▶ Следующая игра':'⌂ На главную'}</button></div></section>`;talk(id)}
window.toHome=toHome;window.openLevel=openLevel;window.explore=explore;window.startMinute=startMinute;window.animateClock=animateClock;window.beginQuiz=beginQuiz;window.answer=answer;window.nextQuestion=nextQuestion;window.talk=talk;window.replay=replay;window.openVoiceSettings=openVoiceSettings;window.selectVoice=selectVoice;window.reloadVoices=reloadVoices;
home();
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged',reloadVoices);
  reloadVoices();
  setTimeout(reloadVoices,400);
  setTimeout(reloadVoices,1600);
}
</script></body></html>
