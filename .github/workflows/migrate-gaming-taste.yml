name: Migrate gaming taste profile

on:
  push:
    paths:
      - 'scripts/migrate_gaming_taste.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical gaming taste profile
        run: python scripts/migrate_gaming_taste.py
      - name: Commit canonical profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaming_taste_live.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build canonical live gaming taste profile"
            git push
          fi
