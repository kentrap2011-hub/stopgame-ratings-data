name: Publish KentRAP Steam profile preview

on:
  push:
    branches:
      - main
    paths:
      - 'steam-profile-preview/**'
      - '.github/workflows/steam-profile-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kentrap-steam-profile-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare only the Steam profile preview
        run: |
          mkdir -p _site/steam-profile-preview
          cp steam-profile-preview/index.html _site/steam-profile-preview/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
