# calibration trigger
name: One-shot Steam review threshold calibration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calibrate-steam-review-thresholds.yml"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Steam ratings and build calibration report
        run: |
          python - <<'PY'
          import json, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import quote
          import urllib.request
          from difflib import SequenceMatcher

          ROOT = Path('.')
          ratings = json.loads((ROOT/'ratings.json').read_text(encoding='utf-8'))['games']
          wishlist_doc = json.loads((ROOT/'steam_wishlist.json').read_text(encoding='utf-8'))
          wishlist = wishlist_doc['games']

          def norm(s):
              s = unicodedata.normalize('NFKC', s or '').lower()
              s = s.replace('™','').replace('®','')
              s = re.sub(r'[^a-z0-9а-яё]+', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()

          wishlist_by_title = {norm(x['title']): x for x in wishlist}

          def get_json(url, retries=4):
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception:
                      time.sleep(0.7*(i+1))
              return None

          def review(appid, language):
              url=(f'https://store.steampowered.com/appreviews/{appid}?json=1&filter=all&language={language}'
                   '&day_range=365&review_type=all&purchase_type=all&num_per_page=20&filter_offtopic_activity=1')
              d=get_json(url)
              if not d or d.get('success') != 1:
                  return {'ok':False,'count':0,'positive_raw':None,'positive_display':None}
              q=d.get('query_summary') or {}
              total=int(q.get('total_reviews') or 0); pos=int(q.get('total_positive') or 0)
              if total<=0:
                  return {'ok':True,'count':0,'positive_raw':None,'positive_display':None}
              raw=pos*100.0/total
              return {'ok':True,'count':total,'positive_raw':round(raw,2),'positive_display':int(raw+0.5)}

          def pair(appid):
              return {'global':review(appid,'all'),'russian':review(appid,'russian')}

          wish_rows=[]
          for i,g in enumerate(wishlist,1):
              wish_rows.append({'appid':str(g['appid']),'title':g['title'],**pair(g['appid'])})
              if i%15==0: print('wishlist',i,'/',len(wishlist))
              time.sleep(0.04)

          rated_rows=[]; unresolved=[]
          for i,g in enumerate(ratings,1):
              title=g['title']; nt=norm(title); appid=None; method=None; steam_title=None
              if nt in wishlist_by_title:
                  w=wishlist_by_title[nt]; appid=str(w['appid']); steam_title=w['title']; method='wishlist_exact_title'
              else:
                  d=get_json('https://store.steampowered.com/api/storesearch/?cc=kz&l=english&term='+quote(title))
                  items=(d or {}).get('items') or []
                  exact=[x for x in items[:20] if norm(x.get('name'))==nt]
                  if len(exact)==1:
                      appid=str(exact[0]['id']); steam_title=exact[0]['name']; method='steam_search_exact_title'
                  elif len(exact)>1:
                      unresolved.append({'title':title,'rating':g['rating'],'reason':'ambiguous_exact_title','candidates':[{'appid':x.get('id'),'name':x.get('name')} for x in exact[:5]]}); continue
                  else:
                      scored=[]
                      for x in items[:20]:
                          sc=SequenceMatcher(None,nt,norm(x.get('name'))).ratio()
                          if sc>=0.94: scored.append((sc,x))
                      scored.sort(reverse=True,key=lambda z:z[0])
                      if len(scored)==1 or (len(scored)>1 and scored[0][0]-scored[1][0]>=0.04):
                          sc,x=scored[0]; appid=str(x['id']); steam_title=x['name']; method=f'steam_search_fuzzy_{sc:.3f}'
                      else:
                          unresolved.append({'title':title,'rating':g['rating'],'reason':'no_safe_mapping','candidates':[{'appid':x.get('id'),'name':x.get('name')} for x in items[:5]]}); continue
              rated_rows.append({'appid':appid,'title':title,'steam_title':steam_title,'user_rating':g['rating'],'mapping_method':method,'in_wishlist':nt in wishlist_by_title,**pair(appid)})
              if i%15==0: print('rated',i,'/',len(ratings),'mapped',len(rated_rows))
              time.sleep(0.04)

          def effective(row, ru_min_count=100):
              vals=[]; g=row['global']; r=row['russian']
              if g['positive_display'] is not None: vals.append(g['positive_display'])
              if r['positive_display'] is not None and r['count']>=ru_min_count: vals.append(r['positive_display'])
              return max(vals) if vals else None

          for row in rated_rows: row['effective_percent_ru100']=effective(row)
          for row in wish_rows: row['effective_percent_ru100']=effective(row)

          def pct(vals,p):
              vals=sorted(v for v in vals if v is not None)
              if not vals:return None
              idx=(len(vals)-1)*p; lo=int(idx); hi=min(lo+1,len(vals)-1); f=idx-lo
              return round(vals[lo]*(1-f)+vals[hi]*f,1)

          groups={
            'strong_positive_4plus':[r for r in rated_rows if r['user_rating']>=4],
            'positive_3_5plus':[r for r in rated_rows if r['user_rating']>=3.5],
            'neutral_3':[r for r in rated_rows if r['user_rating']==3],
            'negative_2_5minus':[r for r in rated_rows if r['user_rating']<=2.5],
          }
          dist={}
          for name,rows in groups.items():
              vals=[r['effective_percent_ru100'] for r in rows if r['effective_percent_ru100'] is not None]
              dist[name]={'n':len(vals),'min':min(vals) if vals else None,'p10':pct(vals,.10),'p25':pct(vals,.25),'median':pct(vals,.50),'p75':pct(vals,.75),'p90':pct(vals,.90),'max':max(vals) if vals else None}

          thresholds=[]
          for t in range(60,96):
              rec={'threshold':t}
              for name,rows in groups.items():
                  vals=[r['effective_percent_ru100'] for r in rows if r['effective_percent_ru100'] is not None]
                  rec[name+'_pass_n']=sum(v>=t for v in vals)
                  rec[name+'_pass_rate']=round(sum(v>=t for v in vals)/len(vals),4) if vals else None
              wvals=[r['effective_percent_ru100'] for r in wish_rows if r['effective_percent_ru100'] is not None]
              rec['wishlist_pass_n']=sum(v>=t for v in wvals); rec['wishlist_pass_rate']=round(sum(v>=t for v in wvals)/len(wvals),4) if wvals else None
              thresholds.append(rec)

          out={
            'generated_at_utc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
            'inputs':{'ratings_count':len(ratings),'wishlist_count':len(wishlist),'rated_mapped':len(rated_rows),'rated_unresolved':len(unresolved)},
            'method':{'effective_percent':'max(global display %, russian display % if russian review count >=100)','important':'Wishlist is interest/recall context, not proof of taste fit. User rating groups are primary evidence.','production_vote_count_thresholds_changed':False},
            'distribution':dist,'threshold_table':thresholds,
            'rated_low_positive_examples':sorted([r for r in rated_rows if r['user_rating']>=3.5 and r['effective_percent_ru100'] is not None],key=lambda r:r['effective_percent_ru100'])[:20],
            'rated_high_negative_examples':sorted([r for r in rated_rows if r['user_rating']<=2.5 and r['effective_percent_ru100'] is not None],key=lambda r:r['effective_percent_ru100'],reverse=True)[:20],
            'wishlist_low_rating_examples':sorted([r for r in wish_rows if r['effective_percent_ru100'] is not None],key=lambda r:r['effective_percent_ru100'])[:25],
            'rated_games':rated_rows,'wishlist_games':wish_rows,'unresolved_rated_games':unresolved}
          Path('steam_review_threshold_calibration_2026-08-28.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('report rated mapped',len(rated_rows),'unresolved',len(unresolved),'wishlist',len(wish_rows))
          PY

      - name: Commit calibration artifact
        run: |
          git config user.name "taste-calibration-bot"
          git config user.email "taste-calibration-bot@users.noreply.github.com"
          git add steam_review_threshold_calibration_2026-08-28.json
          git commit -m "Add Steam review threshold calibration artifact"
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main
