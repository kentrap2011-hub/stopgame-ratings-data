name: One-shot Steam threshold decision table

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-threshold-decision-table.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact decision table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('steam_review_threshold_calibration_summary_2026-08-28.json').read_text(encoding='utf-8'))
          selected=[70,72,75,78,80,82,85,88,90,92]
          out={
            'rated_total':s['rated_total'],
            'rated_exact_safe_n':s['rated_exact_safe_n'],
            'wishlist_n':s['wishlist_n'],
            'semantics':s['semantics'],
            'by_min_global_count':{}
          }
          for mc,block in s['by_min_global_count'].items():
              rows=[]
              by={x['threshold']:x for x in block['thresholds']}
              for t in selected:
                  x=by[t]
                  rows.append({
                    'threshold':t,
                    'positive_3_5plus_n':x['positive_3_5plus_n'],
                    'positive_3_5plus_pass_rate':x['positive_3_5plus_pass_rate'],
                    'strong_positive_4plus_n':x['strong_positive_4plus_n'],
                    'strong_positive_4plus_pass_rate':x['strong_positive_4plus_pass_rate'],
                    'negative_2_5minus_n':x['negative_2_5minus_n'],
                    'negative_2_5minus_pass_rate':x['negative_2_5minus_pass_rate'],
                    'wishlist_n':x['wishlist_n'],
                    'wishlist_pass_rate':x['wishlist_pass_rate'],
                  })
              out['by_min_global_count'][mc]={
                'rated_eligible_n':block['rated_eligible_n'],
                'wishlist_eligible_n':block['wishlist_eligible_n'],
                'selected_thresholds':rows,
                'lowest_positive_examples':block['lowest_positive_examples'][:6],
                'highest_negative_examples':block['highest_negative_examples'][:6],
                'lowest_wishlist_examples':block['lowest_wishlist_examples'][:8],
              }
          Path('steam_review_threshold_decision_table_2026-08-28.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit decision table
        run: |
          git config user.name "taste-calibration-bot"
          git config user.email "taste-calibration-bot@users.noreply.github.com"
          git add steam_review_threshold_decision_table_2026-08-28.json
          git commit -m "Add Steam threshold decision table"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
